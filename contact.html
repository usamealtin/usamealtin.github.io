<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Usame Altinisik</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="site-header">
        <div class="nav-container glass-panel">
            <div class="logo">UA<span>Portfolio</span></div>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="education.html">Education</a></li>
                    <li><a href="skills.html">Skills</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="blogs.html">Blogs</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="page-grid">
        <section id="contact" class="section glass-panel">
            <header class="section-header">
                <h2>Contact</h2>
                <p>Get in touch with me</p>
            </header>

            <article class="contact-content">
                <p>
                    If you would like to collaborate on a project or simply say hello, feel free to send a message.
                </p>

                <form class="contact-form" action="#" method="post">
                    <div class="form-row">
                        <label for="name">Name</label>
                        <input id="name" name="name" type="text" placeholder="Your full name" required>
                    </div>

                    <div class="form-row">
                        <label for="email">Email</label>
                        <input id="email" name="email" type="email" placeholder="you@example.com" required>
                    </div>

                    <div class="form-row">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="4" placeholder="Write your message here..."
                            required></textarea>
                    </div>

                    <button type="submit" class="btn-primary">Send Message</button>
                </form>
            </article>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Usame Altinisik. All rights reserved.</p>
    </footer>
</body>

</html>
