<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Works - Usame Altinisik</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body class="has-footer">
    <div id="navbar-root"></div>

    <main class="page-grid">
        <section class="section glass-panel">
            <header class="section-header">
                <h2>Works</h2>
                <p>Tasarımlar, kodlar ve oyunlar</p>
            </header>
            <div class="works-grid">
                <article class="work-card">
                    <img src="ss.png" alt="Önizleme" class="work-preview">
                    <div class="work-info">
                        <h3>Portfolio Sitesi</h3>
                        <p>Cam efektli, responsive portfolio.</p>
                    </div>
                </article>
                <article class="work-card">
                    <img src="bilim.jpg" alt="Önizleme" class="work-preview">
                    <div class="work-info">
                        <h3>Eğitim Landing</h3>
                        <p>Eğitim şirketi için landing sayfası tasarımı.</p>
                    </div>
                </article>
                <article class="work-card">
                    <div class="work-preview" style="display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 0.9rem;">UI / Oyun</div>
                    <div class="work-info">
                        <h3>UI & Oyun Denemeleri</h3>
                        <p>Butonlar, kartlar ve küçük oyun prototipleri.</p>
                    </div>
                </article>
            </div>
        </section>
    </main>

    <div id="footer-root"></div>
</body>

</html>
